; PlatformIO Project Configuration File
;
; mx5-dash - Custom vehicle display for a 2022 Mazda MX-5 RF GT (automatic)
; Hardware:
;   - Waveshare ESP32-S3-Touch-LCD-3.5B (ESP32-S3R8, 16MB flash, 8MB PSRAM,
;     320x480 IPS, AXS15231B display driver, AXS5106L capacitive touch)
;   - ELM327 Wi-Fi OBD2 adapter (TCP server on port 35000, ELM327 v1.5
;     ASCII command protocol over raw TCP; leaves the adapter's Bluetooth
;     radio free for the phone to use on a dual-radio adapter like vLinker BS)
;
; Docs:
;   https://www.waveshare.com/wiki/ESP32-S3-Touch-LCD-3.5B

[platformio]
default_envs = esp32s3_touch_lcd_3_5b

[env:esp32s3_touch_lcd_3_5b]
platform = espressif32@6.9.0
framework = arduino
board = esp32-s3-devkitc-1
board_upload.flash_size = 16MB
board_build.flash_mode = qio
board_build.f_flash = 80000000L
board_build.f_cpu = 240000000L
board_build.partitions = partitions/partition_16M.csv
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
build_flags =
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
    -DBOARD_HAS_PSRAM
    -mfix-esp32-psram-cache-issue
    -DLV_CONF_PATH='"${PROJECT_DIR}/lv_conf.h"'
    -DLV_USE_OBJ_NAME=1
    -DLV_USE_LOG=0
lib_deps =
    ; LVGL v9 - GUI framework (drives display + handles touch swipes)
    lvgl/lvgl@^9.2.0
    ; Arduino_GFX - low-level display driver for the Waveshare AXS15231B panel
    ; NOTE: pinned to 1.4.x - newer 1.5+/1.6.x require the newer Arduino-ESP32
    ;       core (esp32-hal-periman.h) that espressif32@6.9.0 does not ship.
    moononournation/GFX Library for Arduino@1.4.0
    ; I2C port expander that enables the display/touch power on this board
    robtillaart/TCA9554@^0.1.2
