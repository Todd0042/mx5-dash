; PlatformIO Project Configuration File
;
; mx5-dash - Custom vehicle display for a 2022 Mazda MX-5 RF GT (automatic)
; Hardware:
;   - Waveshare ESP32-S3-Touch-LCD-3.5B (ESP32-S3R8, 16MB flash, 8MB PSRAM,
;     320x480 IPS, AXS15231B display driver, AXS5106L capacitive touch)
;   - ELM327 Wi-Fi OBD2 adapter (TCP server on port 35000, ELM327 v1.5
;     ASCII command protocol over raw TCP; leaves the adapter's Bluetooth
;     radio free for the phone to use on a dual-radio adapter like vLinker BS)
;
; Docs:
;   https://www.waveshare.com/wiki/ESP32-S3-Touch-LCD-3.5B

[platformio]
default_envs = esp32s3_touch_lcd_3_5b

[env:esp32s3_touch_lcd_3_5b]
platform = espressif32@6.9.0
framework = arduino
board = esp32-s3-devkitc-1
; ESP32-S3R8 = 8MB octal (OPI) PSRAM. Select the matching precompiled core
; variant (qio flash + opi psram) - the stock devkitc-1 board defaults to
; qio_qspi (quad PSRAM), which will not drive the octal chip on this board.
; matches Ardunio-ESP32's esp32s3box configuration.
board_build.psram_type = opi
board_build.arduino.memory_type = qio_opi
board_upload.flash_size = 16MB
board_build.flash_mode = qio
board_build.f_flash = 80000000L
board_build.f_cpu = 240000000L
board_build.partitions = partitions/partition_16M.csv
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
build_flags =
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
    -DBOARD_HAS_PSRAM
    -mfix-esp32-psram-cache-issue
    -DLV_CONF_PATH='"${PROJECT_DIR}/lv_conf.h"'
    -DLV_USE_OBJ_NAME=1
    -DLV_USE_LOG=0
    -DNIMBLE_CPP_LOG_LEVEL=3
build_src_filter =
    +<*>
    -<sim_main.cpp>
lib_deps =
    ; LVGL v9 - GUI framework (drives display + handles touch swipes)
    lvgl/lvgl@^9.2.0
    ; I2C port expander that enables the display/touch power on this board
    robtillaart/TCA9554@^0.1.2
    ; NimBLE - Lightweight Bluetooth Low Energy stack for ESP32
    h2zero/NimBLE-Arduino@^1.4.2

; ---------------------------------------------------------------------------
; Waveshare ESP32-S3-Touch-LCD-3.5 (Standard ST7796 SPI + FT6336 edition)
; ---------------------------------------------------------------------------
[env:esp32s3_touch_lcd_3_5]
extends = env:esp32s3_touch_lcd_3_5b
board_upload.flash_size = 8MB
board_build.partitions = partitions/partition_8M.csv

; ---------------------------------------------------------------------------
; Desktop preview - builds the exact same LVGL UI for the PC with an animated
; fake-telemetry mock instead of the Waveshare panel + Wi-Fi ELM327 stack.
;
;   pio run -e native_preview
;   .pio/build/native_preview/program   (or `pio run -t exec ...` to run)
;
; Requires the SDL2 dev package (Arch: pacman -S sdl2).
; ---------------------------------------------------------------------------
[env:native_preview]
platform = native
lib_ignore = obd_ble, obd_wifi, waveshare_display, GFX_Library_for_Arduino, XPowersLib, TCA9554, SensorLib
build_src_filter =
    +<*>
    -<main.cpp>
    +<sim_main.cpp>
build_flags =
    -g
    -DLV_CONF_PATH='"${PROJECT_DIR}/lv_conf.h"'
    -DLV_USE_OBJ_NAME=1
    -I/usr/include/SDL2
    -D_GNU_SOURCE=1
    -D_REENTRANT
    -L/usr/lib -lSDL2
lib_deps =
    lvgl/lvgl@^9.2.0
